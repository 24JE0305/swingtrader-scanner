name: SwingTrader Daily Scan

on:
  schedule:
    # 10:05 UTC = 3:35 PM IST, Mon-Fri. GitHub's scheduler can lag by
    # a few minutes at busy times — that's fine for an EOD scan.
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIVE_SYMBOLS: ${{ vars.ACTIVE_SYMBOLS }}
        run: python daily_scanner.py
